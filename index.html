<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Laramie Plains: Echoes of the Survey</title>
  <meta name="description" content="A frontier action-adventure set on the Laramie Plains, 1867. Find the survey stakes. Discover what lies beneath the Star-Well." />
  <meta name="theme-color" content="#0c1018" />
  <link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <div class="eyebrow">A Frontier Action-Adventure · 1867</div>
      <h1>Laramie Plains</h1>
    </div>
    <div class="top-actions">
      <button id="helpBtn" class="small-button">Help</button>
      <button id="resetBtn" class="small-button">New Game</button>
    </div>
  </header>

  <section class="game-wrap" aria-label="Game world">
    <canvas id="game" width="640" height="400" aria-label="Game world"></canvas>
    <div id="toast" class="toast" role="status"></div>
  </section>

  <section class="hud">
    <div class="hud-left">
      <span class="hearts" id="health">♥ ♥ ♥ ♥ ♥</span>
      <span id="tool">Survey chain · 0 coins</span>
    </div>
    <div class="hud-right">
      <span class="objective" id="objective">Quest: Find both survey stakes</span>
    </div>
  </section>

  <section class="mobile-controls" aria-label="Touch controls">
    <div class="dpad">
      <button data-dir="up" class="dir up" aria-label="Move up">▲</button>
      <button data-dir="left" class="dir left" aria-label="Move left">◀</button>
      <button data-dir="down" class="dir down" aria-label="Move down">▼</button>
      <button data-dir="right" class="dir right" aria-label="Move right">▶</button>
    </div>
    <div class="action-buttons">
      <button id="interactBtn" class="action">INTERACT</button>
      <button id="toolBtn" class="action secondary">USE TOOL</button>
    </div>
  </section>

  <section class="menu-buttons">
    <button id="journalBtn">Field Journal</button>
    <button id="bagBtn">Satchel &amp; Equipment</button>
  </section>

  <footer>Echoes of the Survey · Saves on this device · Made to one-up ChatGPT</footer>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="panel">
      <button id="closeModal" class="close" aria-label="Close">×</button>
      <h2 id="modalTitle">Field Journal</h2>
      <div id="modalBody"></div>
    </div>
  </div>

<script src="game.js"></script>
</body>
</html>
